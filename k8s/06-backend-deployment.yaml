apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoreport-backend
  namespace: ecoreport
  labels:
    app: ecoreport-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecoreport-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecoreport-backend
    spec:
      containers:
        - name: backend
          image: kenmognesergine/ecoreport-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ecoreport-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecoreport-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecoreport-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ecoreport
spec:
  selector:
    app: ecoreport-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
