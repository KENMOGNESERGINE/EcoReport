---
- name: Deploy EcoReport Application
  hosts: ecoreport_servers
  become: yes
  vars:
    app_dir: /opt/ecoreport
    docker_image: kenmognesergine/ecoreport-backend:latest

  tasks:
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Clone repository
      git:
        repo: https://github.com/KENMOGNESERGINE/EcoReport.git
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Pull Docker image
      docker_image:
        name: "{{ docker_image }}"
        source: pull
        force_source: yes

    - name: Stop old container
      docker_container:
        name: ecoreport-backend
        state: absent
      ignore_errors: yes

    - name: Start backend container
      docker_container:
        name: ecoreport-backend
        image: "{{ docker_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "3000:3000"
        env:
          NODE_ENV: production
          DB_HOST: localhost
          DB_NAME: wastecycle
          DB_USER: postgres
          DB_PASSWORD: postgres123
          JWT_SECRET: wastecycle_secret_change_in_production

    - name: Check app health
      uri:
        url: http://localhost:3000/api/health
        status_code: 200
      retries: 10
      delay: 5
